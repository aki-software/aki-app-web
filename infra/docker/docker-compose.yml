services:
  postgres:
    image: postgres:16-alpine
    container_name: akit-postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2.5-alpine
    container_name: akit-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: akit-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:4317:4317" # OTLP gRPC receiver
      - "127.0.0.1:4318:4318" # OTLP HTTP receiver
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: akit-seaweedfs
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      S3_BUCKET: ${SEAWEEDFS_REPORTS_BUCKET}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: akit-seaweedfs-init
    depends_on:
      - seaweedfs
    environment:
      SEAWEEDFS_REPORTS_BUCKET: ${SEAWEEDFS_REPORTS_BUCKET}
      SEAWEEDFS_DB_BACKUPS_BUCKET: ${SEAWEEDFS_DB_BACKUPS_BUCKET}
    volumes:
      - ./seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"


  api-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: akit-api:local
    container_name: akit-api-migrate
    working_dir: /app/apps/api
    command: ["node", "./node_modules/typeorm/cli.js", "migration:run", "-d", "dist/config/typeorm.config.js"]
    env_file:
      - path: ../../apps/api/.env
        required: false
    environment:
      # Same connection contract as production (single URL). SSL is disabled
      # because the local postgres container does not support it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: akit-api:local
    container_name: akit-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    env_file:
      - path: ../../apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      ENABLE_LOCAL_METRICS: "true"
      LOCAL_METRICS_BIND_ADDRESS: 0.0.0.0
      LOCAL_METRICS_PORT: "9464"
      PORT: "3000"
      # Same connection contract as production (single URL). SSL is disabled
      # because the local postgres container does not support it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      ENABLE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${SEAWEEDFS_REPORTS_BUCKET}
      S3_REGION: auto
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:${LOCAL_OBSERVABILITY_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - observability_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "127.0.0.1:${LOCAL_OBSERVABILITY_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - observability_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  seaweedfs_data:
  observability_prometheus_data:
  observability_grafana_data:
