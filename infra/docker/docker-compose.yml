services:
  postgres:
    image: postgres:16-alpine
    container_name: akit-postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2.5-alpine
    container_name: akit-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: akit-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: akit-seaweedfs
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      S3_BUCKET: ${SEAWEEDFS_REPORTS_BUCKET}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: akit-seaweedfs-init
    depends_on:
      - seaweedfs
    environment:
      SEAWEEDFS_REPORTS_BUCKET: ${SEAWEEDFS_REPORTS_BUCKET}
      SEAWEEDFS_DB_BACKUPS_BUCKET: ${SEAWEEDFS_DB_BACKUPS_BUCKET}
    volumes:
      - ./seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"


  api-migrate:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: akit-api:local
    container_name: akit-api-migrate
    working_dir: /app/apps/api
    command: ["node", "./node_modules/typeorm/cli.js", "migration:run", "-d", "dist/config/typeorm.config.js"]
    env_file:
      - path: ../../apps/api/.env
        required: false
    environment:
      # Same connection contract as production (single URL). SSL is disabled
      # because the local postgres container does not support it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: akit-api:local
    container_name: akit-api
    env_file:
      - path: ../../apps/api/.env
        required: false
    environment:
      PORT: "3000"
      # Same connection contract as production (single URL). SSL is disabled
      # because the local postgres container does not support it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      ENABLE_BULLMQ: "true"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${SEAWEEDFS_REPORTS_BUCKET}
      S3_REGION: auto
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  seaweedfs_data:
