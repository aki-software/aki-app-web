name: Platform CI

on:
  push:
    branches: [main, dev, 'feat/*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint
        run: pnpm turbo run lint --cache-dir=".turbo"

      - name: Payment MVP tests
        run: >-
          pnpm --filter api test -- --runInBand
          src/payments/payments-security.foundation.spec.ts
          src/payments/services/checkout.service.spec.ts
          src/payments/services/webhook-processor.service.spec.ts
          && pnpm --filter web test --
          src/features/billing/pages/__tests__/BillingDashboard.test.tsx

      - name: Build
        run: pnpm turbo run build --cache-dir=".turbo"
