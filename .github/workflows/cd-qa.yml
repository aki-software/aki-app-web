name: CD QA

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write # Required to push to GHCR

jobs:
  # ─── Detect which apps changed ───────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/design-tokens/**'
              - 'apps/api/Dockerfile'
              - 'pnpm-lock.yaml'

  # ─── Build API image and push to GHCR ───────────────────────────────────────
  publish-api-image:
    name: Publish API Image to GHCR
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/akit-api
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-,format=short

      - name: Build and push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy API to Render (QA) ────────────────────────────────────────────
  deploy-api-qa:
    name: Deploy API to Render (QA)
    runs-on: ubuntu-latest
    needs: [changes, publish-api-image]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping deploy."
            exit 1
          fi
          curl -X POST -d '{}' "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

