name: CD QA

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write # Required to push to GHCR

jobs:
  # ─── Detect which apps changed ───────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/design-tokens/**'
              - 'apps/api/Dockerfile'
              - 'pnpm-lock.yaml'

  # ─── Build API image and push to GHCR ───────────────────────────────────────
  publish-api-image:
    name: Publish API Image to GHCR
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/akit-api
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-,format=short

      - name: Build and push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy API to Render (QA) via Render API ───────────────────────────────
  deploy-api-qa:
    name: Deploy API to Render (QA)
    runs-on: ubuntu-latest
    needs: [changes, publish-api-image]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Inject secrets via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_QA_SERVICE_ID }}
        run: |
          curl -sS --fail-with-body -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '[
              {"key": "NODE_ENV",            "value": "staging"},
              {"key": "PAYMENT_SIMULATION",  "value": "true"},
              {"key": "PORT",                "value": "3000"},
              {"key": "DATABASE_URL",        "value": "${{ secrets.QA_DATABASE_URL }}"},
              {"key": "JWT_SECRET",          "value": "${{ secrets.QA_JWT_SECRET }}"},
              {"key": "REDIS_URL",           "value": "${{ secrets.QA_REDIS_URL }}"},
              {"key": "FIREBASE_PROJECT_ID", "value": "${{ secrets.QA_FIREBASE_PROJECT_ID }}"},
              {"key": "WEB_APP_URL",         "value": "https://akit-web-qa.pages.dev"},
              {"key": "FRONTEND_URL",        "value": "https://akit-web-qa.pages.dev"},
              {"key": "API_URL",             "value": "https://akit-api-qa.onrender.com"},
              {"key": "CORS_ORIGIN",         "value": "https://akit-web-qa.pages.dev"},
              {"key": "MAIL_TRANSPORT_TYPE", "value": "smtp"},
              {"key": "SMTP_HOST",           "value": "localhost"},
              {"key": "SMTP_PORT",           "value": "1025"},
              {"key": "JWT_EXPIRATION",      "value": "8h"}
            ]'

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_QA_SERVICE_ID }}
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'
