name: CD QA

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write # Required to push to GHCR

jobs:
  # ─── Detect which apps changed ───────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/design-tokens/**'
              - 'apps/api/Dockerfile'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/design-tokens/**'
              - 'pnpm-lock.yaml'
            site:
              - 'apps/site/**'
              - 'packages/design-tokens/**'
              - 'pnpm-lock.yaml'

  # ─── Build API image and push to GHCR ───────────────────────────────────────
  publish-api-image:
    name: Publish API Image to GHCR
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/akit-api
          tags: |
            type=raw,value=qa-latest
            type=sha,prefix=qa-,format=short

      - name: Build and push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Run Database Migrations on QA (Neon) ──────────────────────────────────
  migrate-api-qa:
    name: Run Migrations on Neon QA
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: |
          pnpm --filter @akit/contracts build
          pnpm --filter @akit/design-tokens build

      - name: Run TypeORM migrations
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: pnpm --filter api migration:run

  # ─── Deploy API to Render (QA) via Render API ───────────────────────────────
  deploy-api-qa:
    name: Deploy API to Render (QA)
    runs-on: ubuntu-latest
    needs: [changes, publish-api-image, migrate-api-qa]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Inject secrets via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_QA_SERVICE_ID }}
        run: |
          curl -sS --fail-with-body -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '[
              {"key": "NODE_ENV",            "value": "staging"},
              {"key": "PAYMENT_SIMULATION",  "value": "true"},
              {"key": "PORT",                "value": "3000"},
              {"key": "DATABASE_URL",        "value": "${{ secrets.QA_DATABASE_URL }}"},
              {"key": "JWT_SECRET",          "value": "${{ secrets.QA_JWT_SECRET }}"},
              {"key": "REDIS_URL",           "value": "${{ secrets.QA_REDIS_URL }}"},
              {"key": "FIREBASE_PROJECT_ID", "value": "${{ secrets.QA_FIREBASE_PROJECT_ID }}"},
              {"key": "WEB_APP_URL",         "value": "https://aki-web-qa.pages.dev"},
              {"key": "FRONTEND_URL",        "value": "https://aki-web-qa.pages.dev"},
              {"key": "API_URL",             "value": "https://akit-api-qa-zrqz.onrender.com"},
              {"key": "CORS_ORIGIN",         "value": "https://aki-web-qa.pages.dev"},
              {"key": "MAIL_TRANSPORT_TYPE", "value": "smtp"},
              {"key": "SMTP_HOST",           "value": "localhost"},
              {"key": "SMTP_PORT",           "value": "1025"},
              {"key": "JWT_EXPIRATION",      "value": "8h"},
              {"key": "S3_ENDPOINT",         "value": "https://stub.r2.cloudflarestorage.com"},
              {"key": "S3_BUCKET",           "value": "akit-private-reports-qa"},
              {"key": "S3_REGION",           "value": "auto"},
              {"key": "S3_ACCESS_KEY",       "value": "qa-stub-access-key"},
              {"key": "S3_SECRET_KEY",       "value": "qa-stub-secret-key-00000000000000000000"},
              {"key": "PUPPETEER_EXECUTABLE_PATH", "value": "/usr/bin/chromium-browser"}
            ]'

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_QA_SERVICE_ID }}
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'

  # ─── Deploy Web to Cloudflare Pages (QA) ────────────────────────────────────
  deploy-web-qa:
    name: Deploy Web to CF Pages (QA)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: |
          pnpm --filter @akit/contracts build
          pnpm --filter @akit/design-tokens build

      - name: Build Web
        env:
          VITE_API_URL: https://akit-api-qa-zrqz.onrender.com/api/v1
          VITE_PAYMENT_GATEWAY: MERCADO_PAGO
        run: pnpm --filter web build

      - name: Deploy Web to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy apps/web/dist --project-name aki-web-qa --branch main

  # ─── Deploy Site to Cloudflare Pages (QA) ───────────────────────────────────
  deploy-site-qa:
    name: Deploy Site to CF Pages (QA)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm --filter @akit/design-tokens build

      - name: Build Site
        env:
          PUBLIC_WEB_URL: https://aki-web-qa.pages.dev
          PUBLIC_API_URL: https://akit-api-qa-zrqz.onrender.com/api/v1
          PUBLIC_MAINTENANCE_MODE: "false"
        run: pnpm --filter site build

      - name: Deploy Site to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy apps/site/dist --project-name aki-site-qa --branch main

