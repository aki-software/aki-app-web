services:
  - type: web
    name: akit-api-qa
    env: image
    registryCredential: github-packages
    region: ohio
    plan: free
    image:
      imagePath: ghcr.io/aki-software/akit-api:qa-latest
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "3000"
      - key: PAYMENT_SIMULATION
        value: "true"
      - key: WEB_APP_URL
        value: https://qa.akituvocacion.com.ar
      - key: API_URL
        value: https://akit-api-qa.onrender.com
      # Sensitive values are injected by GitHub Actions via Render API at deploy time.
      # See .github/workflows/cd-qa.yml and the repository secrets.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
