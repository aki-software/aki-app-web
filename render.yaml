services:
  - type: web
    name: akit-api-qa
    env: image
    registryCredential: github-packages
    region: ohio # Adjust if needed
    plan: free # Adjust based on Render plan
    image:
      imagePath: ghcr.io/aki-software/akit-api:qa-latest
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: WEB_APP_URL
        value: https://qa.akituvocacion.com.ar
      - key: API_URL
        value: https://akit-api-qa.onrender.com
      - key: PAYMENT_IDEMPOTENCY_SECRET
        value: qa_secret_12345
      - key: STRIPE_SECRET_KEY
        value: sk_test_123
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_123
      - key: MP_ACCESS_TOKEN
        value: TEST-12345
      - key: MP_WEBHOOK_SECRET
        value: test_secret
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.aki.app
      - key: GOOGLE_PLAY_REPORT_SKU
        value: qa_sku
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64
        value: e30=
      - key: REDIS_HOST
        value: localhost
