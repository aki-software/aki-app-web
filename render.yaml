        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_NAME
        sync: false

