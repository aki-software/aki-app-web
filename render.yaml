services:
  # ==========================================
  # ENTORNO QA (Rama: dev)
  # ==========================================

  # Backend (API) para QA
  - type: web
    name: akit-api-qa
    env: node
    plan: free
    branch: dev
    buildCommand: >-
      pnpm install &&
      pnpm --filter api exec puppeteer browsers install chrome &&
      pnpm run build --filter api &&
      pnpm --filter api run db:bootstrap &&
      pnpm --filter api run seed:admin
    startCommand: pnpm --filter api run start:prod
    envVars:
      - key: PUPPETEER_CACHE_DIR
        sync: false
      - key: PUPPETEER_EXECUTABLE_PATH
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: NODE_ENV
        sync: false
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
