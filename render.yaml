        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MAIL_TRANSPORT_TYPE
        sync: false
      - key: MAIL_PRO_HOST
        sync: false
